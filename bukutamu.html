<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buku Tamu - Muh. Fadli</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="background"></div>

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>


    <div class="card guestbook">

        <a
            href="index.html"
            class="back-btn"
        >
            ← Kembali
        </a>


        <p class="welcome">
            BUKU TAMU DIGITAL
        </p>


        <h1>
            📖 Buku Tamu
        </h1>


        <p class="guestbook-desc">
            Tinggalkan pesan untuk saya 😊
        </p>


        <!-- FORM -->

        <form id="guestbookForm">


            <div class="form-group">

                <label for="nama">
                    Nama
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama kamu"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email kamu"
                    required
                >

            </div>


            <div class="form-group">

                <label for="pesan">
                    Pesan
                </label>

                <textarea
                    id="pesan"
                    placeholder="Tulis pesan kamu..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                📩 Kirim Pesan
            </button>


            <div
                id="status"
                class="status"
            ></div>

        </form>


        <!-- PESAN PENGUNJUNG -->

        <div class="messages">

            <h2>
                💬 Pesan Pengunjung
            </h2>


            <div id="messageList">

                <p class="loading">
                    ⏳ Memuat pesan...
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
